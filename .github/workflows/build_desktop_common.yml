name: Build Tauri App

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      tauri_args:
        required: true
        type: string
      tauri_target:
        required: true
        type: string
      # pkg_target:
      #   required: true
      #   type: string
      sign_app:
        required: true
        type: boolean
      target_branch:
        required: true
        type: string
      profile:
        required: true
        type: string
      site_url:
        required: true
        type: string
      run_on_self_hosted:
        required: false
        type: boolean
        default: false
      publish_version:
        required: false
        type: string
      enable_debug:
        required: false
        type: boolean
        default: false
      enable_custom_site_url:
        required: true
        type: boolean
        default: false
      enable_tauri_updates:
        required: false
        type: boolean
        default: false

jobs:
  build_tauri:
    runs-on: ${{ (inputs.run_on_self_hosted && 'self-hosted') || inputs.platform }}
    steps:
    - name: Log Workflow Inputs
      run: |
        echo "platform: ${{ inputs.platform }}"
        echo "tauri_args: ${{ inputs.tauri_args }}"
        echo "tauri_target: ${{ inputs.tauri_target }}"
        echo "sign_app: ${{ inputs.sign_app }}"
        echo "target_branch: ${{ inputs.target_branch }}"
        echo "profile: ${{ inputs.profile }}"
        echo "site_url: ${{ inputs.site_url }}"
        echo "enable_debug: ${{ inputs.enable_debug }}"
        echo "enable_custom_site_url: ${{ inputs.enable_custom_site_url }}"

    - name: Checkout code
      uses: actions/checkout@v3
      with:
        repository: ${{ secrets.REPO }}
        token: ${{ secrets.REPO_TOKEN }}
        ref: ${{ inputs.target_branch }}

    - name: Checkout releases repo into `.github/composite-actions`
      uses: actions/checkout@v3
      with:
        repository: jamtools/releases
        path: .github/composite-actions
        ref: ${{ github.sha }}

    - name: Build Tauri App
      uses: ./.github/composite-actions/.github/actions/build_desktop
      with:
        platform: ${{ inputs.platform }}
        publish_version: ${{ inputs.publish_version }}
        tauri_args: ${{ inputs.tauri_args }}
        tauri_target: ${{ inputs.tauri_target }}
        sign_app: ${{ inputs.sign_app }}
        profile: ${{ inputs.profile }}
        site_url: ${{ inputs.site_url }}
        tauri_signing_private_key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        tauri_signing_private_key_password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        apple_certificate: ${{ secrets.APPLE_CERTIFICATE }}
        apple_certificate_password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        apple_signing_identity: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        apple_id: ${{ secrets.APPLE_ID }}
        apple_password: ${{ secrets.APPLE_PASSWORD }}
        apple_team_id: ${{ secrets.APPLE_TEAM_ID }}
        azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
        azure_client_secret: ${{ secrets.AZURE_CLIENT_SECRET }}
        azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
        github_token: ${{ secrets.GITHUB_TOKEN }}
        enable_debug: ${{ inputs.enable_debug }}
        enable_custom_site_url: ${{ inputs.enable_custom_site_url }}
        enable_tauri_updates: ${{ inputs.enable_tauri_updates }}

      # I need to go through the compiled tauri apps, and look at the compiled folder structure
      # and then extract the installable for the given platform
      # and then upload it to artifacts and S3
    - name: Archive built artifacts
      shell: bash
      run: |
        # Find all `bundle` directories
        find ./apps/desktop_tauri/src-tauri/target -type d -name "bundle" | while read -r dir; do
          # Extract the relative path starting after `target/`
          RELATIVE_PATH="${dir#./apps/desktop_tauri/src-tauri/target/}"
          # Copy the `bundle` directory to the corresponding artifacts folder
          DEST_DIR="artifacts/${{ inputs.platform }}/$(dirname "$RELATIVE_PATH")"
          mkdir -p "$DEST_DIR"
          cp -r "$dir" "$DEST_DIR"
        done

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: tauri-build-${{ inputs.platform }}-${{ inputs.tauri_target }}
        path: artifacts/${{ inputs.platform }}

    - name: Get short commit hash
      shell: bash
      id: commit_hash
      run: echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Get current datetime
      shell: bash
      id: datetime
      run: echo "value=$(date +'%Y%m%d_%H%M%S')" >> $GITHUB_OUTPUT

    - name: Extract and rename installer file
      if: inputs.publish_version != ''
      shell: bash
      id: extract_installer
      run: |
        echo "Starting installer file extraction for platform: ${{ inputs.platform }}"

        # Function to sanitize filename for URL compatibility (replace spaces with underscores)
        sanitize_filename() {
          echo "$1" | sed 's/[[:space:]]/_/g'
        }

        if [[ "${{ inputs.platform }}" == "macos-latest" || "${{ inputs.platform }}" == "macos-"* ]]; then
          echo "Processing macOS platform..."

          # Find DMG file with priority order
          DMG_FILE=$(find artifacts/${{ inputs.platform }} -name "*.dmg" | head -1)

          echo "Found DMG files:"
          find artifacts/${{ inputs.platform }} -name "*.dmg" || echo "No DMG files found"

          if [[ -z "$DMG_FILE" ]]; then
            echo "ERROR: No DMG file found in artifacts/${{ inputs.platform }}"
            echo "Available files:"
            find artifacts/${{ inputs.platform }} -type f || echo "No files found"
            exit 1
          fi

          echo "Selected DMG file: $DMG_FILE"

          # Extract and sanitize the original filename
          ORIGINAL_FILENAME=$(basename "$DMG_FILE" .dmg)
          SANITIZED_FILENAME=$(sanitize_filename "$ORIGINAL_FILENAME")

          # Create new filename: datetime_commithash_originalfilename_version.dmg
          NEW_FILENAME="${{ steps.datetime.outputs.value }}_${{ steps.commit_hash.outputs.hash }}_${SANITIZED_FILENAME}_${{ inputs.publish_version }}.dmg"

          echo "Original filename: $ORIGINAL_FILENAME"
          echo "Sanitized filename: $SANITIZED_FILENAME"
          echo "Final filename: $NEW_FILENAME"

        elif [[ "${{ inputs.platform }}" == "windows-latest" || "${{ inputs.platform }}" == "windows-"* ]]; then
          echo "Processing Windows platform..."

          # Find EXE file with priority order: setup files first, then any exe
          EXE_FILE=$(find artifacts/${{ inputs.platform }} -name "*-setup.exe" | head -1)
          if [[ -z "$EXE_FILE" ]]; then
            EXE_FILE=$(find artifacts/${{ inputs.platform }} -name "*setup*.exe" | head -1)
          fi
          if [[ -z "$EXE_FILE" ]]; then
            EXE_FILE=$(find artifacts/${{ inputs.platform }} -name "*.exe" | head -1)
          fi

          echo "Found EXE files:"
          find artifacts/${{ inputs.platform }} -name "*.exe" || echo "No EXE files found"

          if [[ -z "$EXE_FILE" ]]; then
            echo "ERROR: No EXE file found in artifacts/${{ inputs.platform }}"
            echo "Available files:"
            find artifacts/${{ inputs.platform }} -type f || echo "No files found"
            exit 1
          fi

          echo "Selected EXE file: $EXE_FILE"

          # Extract and sanitize the original filename
          ORIGINAL_FILENAME=$(basename "$EXE_FILE" .exe)
          SANITIZED_FILENAME=$(sanitize_filename "$ORIGINAL_FILENAME")

          # Create new filename: datetime_commithash_originalfilename_version.exe
          NEW_FILENAME="${{ steps.datetime.outputs.value }}_${{ steps.commit_hash.outputs.hash }}_${SANITIZED_FILENAME}_${{ inputs.publish_version }}.exe"

          echo "Original filename: $ORIGINAL_FILENAME"
          echo "Sanitized filename: $SANITIZED_FILENAME"
          echo "Final filename: $NEW_FILENAME"

        else
          echo "ERROR: Unsupported platform: ${{ inputs.platform }}"
          echo "Supported platforms: macos-latest, windows-latest (and variants)"
          exit 1
        fi

        # Create staging directory and copy file
        echo "Creating staging directory..."
        if ! mkdir -p staging; then
          echo "ERROR: Failed to create staging directory"
          exit 1
        fi

        echo "Copying installer file to staging..."
        if [[ -n "$DMG_FILE" ]]; then
          SOURCE_FILE="$DMG_FILE"
        else
          SOURCE_FILE="$EXE_FILE"
        fi

        if ! cp "$SOURCE_FILE" "staging/$NEW_FILENAME"; then
          echo "ERROR: Failed to copy $SOURCE_FILE to staging/$NEW_FILENAME"
          exit 1
        fi

        echo "Successfully created: staging/$NEW_FILENAME"
        ls -la "staging/$NEW_FILENAME"

        UPDATER_PAYLOAD_FILENAME=""
        UPDATER_SIGNATURE_FILENAME=""

        if [[ "${{ inputs.platform }}" == "macos-latest" || "${{ inputs.platform }}" == "macos-"* ]]; then
          echo "Locating macOS updater bundle (.app.tar.gz) + signature..."

          TAR_FILE=$(find artifacts/${{ inputs.platform }} -name "*.app.tar.gz" | head -1)
          if [[ -z "$TAR_FILE" ]]; then
            echo "ERROR: No .app.tar.gz file found for updater in artifacts/${{ inputs.platform }}"
            find artifacts/${{ inputs.platform }} -type f | head -n 200 || true
            exit 1
          fi

          TAR_SIG_FILE="${TAR_FILE}.sig"
          if [[ ! -f "$TAR_SIG_FILE" ]]; then
            echo "ERROR: Missing updater signature file: $TAR_SIG_FILE"
            find "$(dirname "$TAR_FILE")" -type f | head -n 200 || true
            exit 1
          fi

          UPDATER_PAYLOAD_FILENAME="${{ steps.datetime.outputs.value }}_${{ steps.commit_hash.outputs.hash }}_${SANITIZED_FILENAME}_${{ inputs.publish_version }}.app.tar.gz"
          UPDATER_SIGNATURE_FILENAME="${UPDATER_PAYLOAD_FILENAME}.sig"

          cp "$TAR_FILE" "staging/$UPDATER_PAYLOAD_FILENAME"
          cp "$TAR_SIG_FILE" "staging/$UPDATER_SIGNATURE_FILENAME"

          echo "Staged updater payload: staging/$UPDATER_PAYLOAD_FILENAME"
          echo "Staged updater signature: staging/$UPDATER_SIGNATURE_FILENAME"
        elif [[ "${{ inputs.platform }}" == "windows-latest" || "${{ inputs.platform }}" == "windows-"* ]]; then
          echo "Locating Windows updater signature for selected installer..."

          EXE_SIG_FILE="${EXE_FILE}.sig"
          if [[ ! -f "$EXE_SIG_FILE" ]]; then
            echo "ERROR: Missing updater signature file: $EXE_SIG_FILE"
            find "$(dirname "$EXE_FILE")" -type f | head -n 200 || true
            exit 1
          fi

          # On Windows we reuse the selected installer as the updater payload.
          UPDATER_PAYLOAD_FILENAME="$NEW_FILENAME"
          UPDATER_SIGNATURE_FILENAME="${NEW_FILENAME}.sig"

          cp "$EXE_SIG_FILE" "staging/$UPDATER_SIGNATURE_FILENAME"

          echo "Staged updater signature: staging/$UPDATER_SIGNATURE_FILENAME"
        fi

        # Set outputs
        echo "installer_file=staging/$NEW_FILENAME" >> $GITHUB_OUTPUT
        echo "filename=$NEW_FILENAME" >> $GITHUB_OUTPUT
        echo "updater_payload_filename=$UPDATER_PAYLOAD_FILENAME" >> $GITHUB_OUTPUT
        echo "updater_signature_filename=$UPDATER_SIGNATURE_FILENAME" >> $GITHUB_OUTPUT

        echo "Installer extraction completed successfully!"

    - name: Upload installer to S3 compatible
      if: inputs.publish_version != ''
      uses: shallwefootball/s3-upload-action@master
      with:
          aws_key_id: ${{ secrets.R2_DESKTOP_APP_KEY_ID }}
          aws_secret_access_key: ${{ secrets.R2_DESKTOP_APP_KEY_SECRET }}
          aws_bucket: ${{ secrets.R2_DESKTOP_APP_BUCKET }}
          source_dir: 'staging'
          destination_dir: 'builds/desktop'
          endpoint: ${{ secrets.R2_DESKTOP_APP_ENDPOINT }}

    - name: Calculate desktop build download URL
      if: inputs.publish_version != ''
      id: calculate_url
      shell: bash
      run: |
        echo "installer_url=${{ secrets.R2_DESKTOP_BUILDS_PUBLIC_URL }}/builds/desktop/${{ steps.extract_installer.outputs.filename }}" >> $GITHUB_OUTPUT

    - name: Get latest commit message
      if: inputs.publish_version != ''
      id: get_commit_message
      shell: bash
      run: |
        # Get only the first line of the commit message
        COMMIT_MSG=$(git log -1 --pretty=%B | head -n1)
        # Use delimiter syntax for proper escaping of special characters
        {
          echo "commit_message<<EOF"
          echo "$COMMIT_MSG"
          echo "EOF"
        } >> $GITHUB_OUTPUT

    - name: Create updater platform manifest artifact
      if: inputs.publish_version != ''
      shell: bash
      env:
        PUBLIC_URL: ${{ secrets.R2_DESKTOP_BUILDS_PUBLIC_URL }}
        PLATFORM: ${{ inputs.platform }}
        TAURI_TARGET: ${{ inputs.tauri_target }}
        PUBLISH_VERSION: ${{ inputs.publish_version }}
        UPDATER_PAYLOAD_FILENAME: ${{ steps.extract_installer.outputs.updater_payload_filename }}
        UPDATER_SIGNATURE_FILENAME: ${{ steps.extract_installer.outputs.updater_signature_filename }}
        COMMIT_MESSAGE: ${{ steps.get_commit_message.outputs.commit_message }}
      run: |
        python3 - <<'PY'
        import json
        import os
        import sys

        public_url = (os.environ.get("PUBLIC_URL") or "").rstrip("/")
        platform = os.environ["PLATFORM"]
        tauri_target = os.environ.get("TAURI_TARGET") or ""
        publish_version = os.environ["PUBLISH_VERSION"]
        payload_filename = os.environ.get("UPDATER_PAYLOAD_FILENAME") or ""
        sig_filename = os.environ.get("UPDATER_SIGNATURE_FILENAME") or ""
        notes = os.environ.get("COMMIT_MESSAGE") or ""

        if not payload_filename or not sig_filename:
          print("Missing updater payload/signature filenames; cannot build manifest.", file=sys.stderr)
          sys.exit(1)

        sig_path = os.path.join("staging", sig_filename)
        with open(sig_path, "r", encoding="utf-8") as f:
          signature = f.read().strip()

        url = f"{public_url}/builds/desktop/{payload_filename}"

        platforms = {}

        if platform.startswith("windows"):
          platforms["windows-x86_64"] = {"url": url, "signature": signature}
        elif platform.startswith("macos"):
          # For universal builds, serve the same tarball/signature for both arch keys.
          if "universal" in tauri_target:
            platforms["darwin-aarch64"] = {"url": url, "signature": signature}
            platforms["darwin-x86_64"] = {"url": url, "signature": signature}
          elif "aarch64" in tauri_target:
            platforms["darwin-aarch64"] = {"url": url, "signature": signature}
          elif "x86_64" in tauri_target:
            platforms["darwin-x86_64"] = {"url": url, "signature": signature}
          else:
            # Default assumption for macos-latest if no explicit target provided
            platforms["darwin-aarch64"] = {"url": url, "signature": signature}
        else:
          print(f"Unsupported platform for updater manifest: {platform}", file=sys.stderr)
          sys.exit(1)

        manifest = {
          "version": publish_version,
          "notes": notes,
          "platforms": platforms,
        }

        os.makedirs("updater-platform-manifest", exist_ok=True)
        out_path = os.path.join("updater-platform-manifest", f"{platform}.json")
        with open(out_path, "w", encoding="utf-8") as f:
          json.dump(manifest, f, indent=2, sort_keys=True)
          f.write("\n")

        print(f"Wrote {out_path}")
        PY

    - name: Upload updater platform manifest artifact
      if: inputs.publish_version != ''
      uses: actions/upload-artifact@v4
      with:
        name: updater-platform-manifest-${{ inputs.platform }}
        path: updater-platform-manifest

    - name: Send Discord message
      if: inputs.publish_version != ''
      shell: bash
      run: |
        # Determine platform name for Discord message
        if [[ "${{ inputs.platform }}" == "macos-latest" || "${{ inputs.platform }}" == "macos-"* ]]; then
          PLATFORM_NAME="macOS"
        elif [[ "${{ inputs.platform }}" == "windows-latest" || "${{ inputs.platform }}" == "windows-"* ]]; then
          PLATFORM_NAME="Windows"
        else
          PLATFORM_NAME="${{ inputs.platform }}"
        fi

        jq -n \
          --arg platform "$PLATFORM_NAME" \
          --arg url "${{ steps.calculate_url.outputs.installer_url }}" \
          --arg commit "${{ steps.get_commit_message.outputs.commit_message }}" \
          '{"content": "Check out the new \($platform) desktop build \($url). \($commit)"}' | \
        curl -X POST -H "Content-Type: application/json" -d @- "${{ secrets.DISCORD_APP_BUILDS_WEBHOOK_URL }}"
