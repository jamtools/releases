name: CI

on:
  push:
    branches:
    - '*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref to use in application repo'
        required: false
        default: 'main'
  repository_dispatch:
    types: [ build-remote, new-commit-on-main ]
env:
  TARGET_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref != '' && github.event.inputs.ref || github.event_name == 'repository_dispatch' && github.event.client_payload.sha != '' && github.event.client_payload.sha || 'main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Set commit status to pending
      if: github.event_name == 'repository_dispatch'
      uses: actions/github-script@v6
      with:
        github-token: ${{ secrets.REPO_TOKEN }}
        script: |
          await github.rest.repos.createCommitStatus({
            owner: '${{ secrets.REPO }}'.split('/')[0],
            repo: '${{ secrets.REPO }}'.split('/')[1],
            sha: '${{ env.TARGET_BRANCH }}',
            state: 'pending',
            context: 'CI / build',
            description: 'Build job in progress...'
          });
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        repository: ${{ secrets.REPO }}
        token: ${{ secrets.REPO_TOKEN }}
        ref: ${{ env.TARGET_BRANCH }}

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.15.0
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'pnpm'
    # - name: Set npm mirror
    #   run: npm config set registry https://npmjs.cf/

    - name: Install modules
      run: pnpm i

    - name: Build app
      run: SPRINGBOARD_PLATFORM_VARIANT=all pnpm run build

    - name: Find and upload npm logs
      if: failure()
      run: |
        mkdir -p artifacts/npm-logs
        find ~/.npm/_logs -type f -name "*.log" -exec cp {} artifacts/npm-logs/ \;
      shell: bash
    - name: Upload npm logs artifact
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: npm-logs
        path: artifacts/npm-logs/
    - name: Set commit status to success
      if: success() && github.event_name == 'repository_dispatch'
      uses: actions/github-script@v6
      with:
        github-token: ${{ secrets.REPO_TOKEN }}
        script: |
          await github.rest.repos.createCommitStatus({
            owner: '${{ secrets.REPO }}'.split('/')[0],
            repo: '${{ secrets.REPO }}'.split('/')[1],
            sha: '${{ env.TARGET_BRANCH }}',
            state: 'success',
            context: 'CI / build',
            description: 'Build completed successfully'
          });
    - name: Set commit status to failure
      if: failure() && github.event_name == 'repository_dispatch'
      uses: actions/github-script@v6
      with:
        github-token: ${{ secrets.REPO_TOKEN }}
        script: |
          await github.rest.repos.createCommitStatus({
            owner: '${{ secrets.REPO }}'.split('/')[0],
            repo: '${{ secrets.REPO }}'.split('/')[1],
            sha: '${{ env.TARGET_BRANCH }}',
            state: 'failure',
            context: 'CI / build',
            description: 'Build failed'
          });
  build-docker:
    runs-on: ubuntu-latest
    steps:
    - name: Set commit status to pending
      if: github.event_name == 'repository_dispatch'
      uses: actions/github-script@v6
      with:
        github-token: ${{ secrets.REPO_TOKEN }}
        script: |
          await github.rest.repos.createCommitStatus({
            owner: '${{ secrets.REPO }}'.split('/')[0],
            repo: '${{ secrets.REPO }}'.split('/')[1],
            sha: '${{ env.TARGET_BRANCH }}',
            state: 'pending',
            context: 'CI / build-docker',
            description: 'Docker build in progress...'
          });

    - name: Checkout code
      uses: actions/checkout@v3
      with:
        repository: ${{ secrets.REPO }}
        token: ${{ secrets.REPO_TOKEN }}
        ref: ${{ env.TARGET_BRANCH }}

    - name: Build Docker image
      run: docker compose build
      env:
        PORT: 1337
    - name: Set commit status to success
      if: success() && github.event_name == 'repository_dispatch'
      uses: actions/github-script@v6
      with:
        github-token: ${{ secrets.REPO_TOKEN }}
        script: |
          await github.rest.repos.createCommitStatus({
            owner: '${{ secrets.REPO }}'.split('/')[0],
            repo: '${{ secrets.REPO }}'.split('/')[1],
            sha: '${{ env.TARGET_BRANCH }}',
            state: 'success',
            context: 'CI / build-docker',
            description: 'Docker build completed successfully'
          });
    - name: Set commit status to failure
      if: failure() && github.event_name == 'repository_dispatch'
      uses: actions/github-script@v6
      with:
        github-token: ${{ secrets.REPO_TOKEN }}
        script: |
          await github.rest.repos.createCommitStatus({
            owner: '${{ secrets.REPO }}'.split('/')[0],
            repo: '${{ secrets.REPO }}'.split('/')[1],
            sha: '${{ env.TARGET_BRANCH }}',
            state: 'failure',
            context: 'CI / build-docker',
            description: 'Docker build failed'
          });
  types:
    runs-on: ubuntu-latest
    steps:
    - name: Set commit status to pending
      if: github.event_name == 'repository_dispatch'
      uses: actions/github-script@v6
      with:
        github-token: ${{ secrets.REPO_TOKEN }}
        script: |
          await github.rest.repos.createCommitStatus({
            owner: '${{ secrets.REPO }}'.split('/')[0],
            repo: '${{ secrets.REPO }}'.split('/')[1],
            sha: '${{ env.TARGET_BRANCH }}',
            state: 'pending',
            context: 'CI / types',
            description: 'Type checking in progress...'
          });
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        repository: ${{ secrets.REPO }}
        token: ${{ secrets.REPO_TOKEN }}
        ref: ${{ env.TARGET_BRANCH }}

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.15.0
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'pnpm'
    # - name: Set npm mirror
    #   run: npm config set registry https://npmjs.cf/

    - name: Install modules
      run: pnpm i

    - name: Install modules for e2e tests
      run: cd tests-e2e && npm i

    - name: Check Types
      run: pnpm run check-types

    - name: Check Types for Tests
      run: cd tests-e2e && npm run check-types
    - name: Set commit status to success
      if: success() && github.event_name == 'repository_dispatch'
      uses: actions/github-script@v6
      with:
        github-token: ${{ secrets.REPO_TOKEN }}
        script: |
          await github.rest.repos.createCommitStatus({
            owner: '${{ secrets.REPO }}'.split('/')[0],
            repo: '${{ secrets.REPO }}'.split('/')[1],
            sha: '${{ env.TARGET_BRANCH }}',
            state: 'success',
            context: 'CI / types',
            description: 'Type checking passed'
          });
    - name: Set commit status to failure
      if: failure() && github.event_name == 'repository_dispatch'
      uses: actions/github-script@v6
      with:
        github-token: ${{ secrets.REPO_TOKEN }}
        script: |
          await github.rest.repos.createCommitStatus({
            owner: '${{ secrets.REPO }}'.split('/')[0],
            repo: '${{ secrets.REPO }}'.split('/')[1],
            sha: '${{ env.TARGET_BRANCH }}',
            state: 'failure',
            context: 'CI / types',
            description: 'Type checking failed'
          });

  test:
    runs-on: ubuntu-latest
    steps:
    - name: Set commit status to pending
      if: github.event_name == 'repository_dispatch'
      uses: actions/github-script@v6
      with:
        github-token: ${{ secrets.REPO_TOKEN }}
        script: |
          await github.rest.repos.createCommitStatus({
            owner: '${{ secrets.REPO }}'.split('/')[0],
            repo: '${{ secrets.REPO }}'.split('/')[1],
            sha: '${{ env.TARGET_BRANCH }}',
            state: 'pending',
            context: 'CI / test',
            description: 'Tests in progress...'
          });
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        repository: ${{ secrets.REPO }}
        token: ${{ secrets.REPO_TOKEN }}
        ref: ${{ env.TARGET_BRANCH }}
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.15.0
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'pnpm'
    # - name: Set npm mirror
    #   run: npm config set registry https://npmjs.cf/

    - name: Install modules
      run: pnpm i

    - name: Run Tests
      run: pnpm run test
    - name: Set commit status to success
      if: success() && github.event_name == 'repository_dispatch'
      uses: actions/github-script@v6
      with:
        github-token: ${{ secrets.REPO_TOKEN }}
        script: |
          await github.rest.repos.createCommitStatus({
            owner: '${{ secrets.REPO }}'.split('/')[0],
            repo: '${{ secrets.REPO }}'.split('/')[1],
            sha: '${{ env.TARGET_BRANCH }}',
            state: 'success',
            context: 'CI / test',
            description: 'Tests passed'
          });
    - name: Set commit status to failure
      if: failure() && github.event_name == 'repository_dispatch'
      uses: actions/github-script@v6
      with:
        github-token: ${{ secrets.REPO_TOKEN }}
        script: |
          await github.rest.repos.createCommitStatus({
            owner: '${{ secrets.REPO }}'.split('/')[0],
            repo: '${{ secrets.REPO }}'.split('/')[1],
            sha: '${{ env.TARGET_BRANCH }}',
            state: 'failure',
            context: 'CI / test',
            description: 'Tests failed'
          });
  db-migrations:
    runs-on: ubuntu-latest
    steps:
    - name: Set commit status to pending
      if: github.event_name == 'repository_dispatch'
      uses: actions/github-script@v6
      with:
        github-token: ${{ secrets.REPO_TOKEN }}
        script: |
          await github.rest.repos.createCommitStatus({
            owner: '${{ secrets.REPO }}'.split('/')[0],
            repo: '${{ secrets.REPO }}'.split('/')[1],
            sha: '${{ env.TARGET_BRANCH }}',
            state: 'pending',
            context: 'CI / db-migrations',
            description: 'DB migrations check in progress...'
          });
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        repository: ${{ secrets.REPO }}
        token: ${{ secrets.REPO_TOKEN }}
        ref: ${{ env.TARGET_BRANCH }}
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.15.0
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'pnpm'

    - name: Install modules
      run: pnpm i

    - name: Install db dependencies
      run: cd db && pnpm i

    - name: Generate kysely types and migrations
      run: cd db && pnpm run ci

    - name: Enterprise - Generate kysely types and migrations
      run: cd packages/enterprise/db && pnpm run ci

    - name: Check for uncommitted changes
      run: |
        if [[ -n $(git status --porcelain) ]]; then
          echo "Uncommitted changes for kysely client or migrations"
          git diff | cat
          exit 1
        fi
    - name: Set commit status to success
      if: success() && github.event_name == 'repository_dispatch'
      uses: actions/github-script@v6
      with:
        github-token: ${{ secrets.REPO_TOKEN }}
        script: |
          await github.rest.repos.createCommitStatus({
            owner: '${{ secrets.REPO }}'.split('/')[0],
            repo: '${{ secrets.REPO }}'.split('/')[1],
            sha: '${{ env.TARGET_BRANCH }}',
            state: 'success',
            context: 'CI / db-migrations',
            description: 'DB migrations check passed'
          });
    - name: Set commit status to failure
      if: failure() && github.event_name == 'repository_dispatch'
      uses: actions/github-script@v6
      with:
        github-token: ${{ secrets.REPO_TOKEN }}
        script: |
          await github.rest.repos.createCommitStatus({
            owner: '${{ secrets.REPO }}'.split('/')[0],
            repo: '${{ secrets.REPO }}'.split('/')[1],
            sha: '${{ env.TARGET_BRANCH }}',
            state: 'failure',
            context: 'CI / db-migrations',
            description: 'DB migrations check failed'
          });
