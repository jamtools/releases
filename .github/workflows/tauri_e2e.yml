# .github/workflows/tauri-e2e.yml
name: Tauri WebDriver E2E
on:
    pull_request:
    push:
        branches:
            - "*"
    workflow_dispatch:

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        # os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          repository: ${{ secrets.REPO }}
          token: ${{ secrets.REPO_TOKEN }}
          ref: tauri-e2e

      - name: Checkout releases repo into `.github/composite-actions`
        uses: actions/checkout@v3
        with:
          repository: jamtools/releases
          path: .github/composite-actions
          ref: ${{ github.sha }}

      # ---- Rust (for tauri + tauri-driver) ----
      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Tauri App
        uses: ./.github/composite-actions/.github/actions/build_desktop
        with:
            platform: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu-22.04' || 'windows-latest' }}
            tauri_args: ''
            tauri_target: ''
            sign_app: false
            profile: production
            site_url: http://localhost:1337
            apple_certificate: ${{ secrets.APPLE_CERTIFICATE }}
            apple_certificate_password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
            apple_signing_identity: ${{ secrets.APPLE_SIGNING_IDENTITY }}
            apple_id: ${{ secrets.APPLE_ID }}
            apple_password: ${{ secrets.APPLE_PASSWORD }}
            apple_team_id: ${{ secrets.APPLE_TEAM_ID }}
            github_token: ${{ secrets.GITHUB_TOKEN }}
            enable_debug: true
            # enable_debug: ${{ inputs.enable_debug }}

      - name: Install Tauri e2e dependencies
        working-directory: tauri-e2e
        run: npm i

      # ---- tauri-driver (shared) ----
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      # ---- Linux-only bits: WebKit driver + xvfb ----
      - name: Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y webkit2gtk-driver xvfb libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - name: Start app server (Windows)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "npm.cmd" -ArgumentList "start" `
                              -WorkingDirectory "${{ github.workspace }}" `
                              -NoNewWindow -PassThru
          Set-Content -Path server.pid -Value $p.Id -Encoding ascii

      - name: Wait for server (HTTP 200)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $ErrorActionPreference = 'SilentlyContinue'

          $url = "http://127.0.0.1:1337/"
          $deadline = (Get-Date).AddMinutes(2)

          while ((Get-Date) -lt $deadline) {
            try {
              $resp = Invoke-WebRequest -Uri $url -Method Head -TimeoutSec 2
              if ($resp.StatusCode -eq 200) {
                Write-Host "Server ready at $url"
                exit 0
              }
            } catch {
              # ignore and retry
            }
            Start-Sleep -Seconds 1
          }

          Write-Error "Server did not return 2xx at $url within 2 minutes"
          exit 1

    #   - name: Run E2E (Linux)
    #     if: matrix.os == 'ubuntu-latest'
    #     run: xvfb-run pnpm -C e2e-tests test

      # ---- Windows-only bits: EdgeDriver + (optional) WebView2 runtime ----
      - name: Install matching EdgeDriver
        if: matrix.os == 'windows-latest'
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool
          "$HOME\.cargo\bin\msedgedriver-tool.exe" | Out-Host
          echo "$PWD" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Optional: ensure WebView2 Runtime (evergreen) exists on the runner
      # (Windows Server images sometimes drift; uncomment if your app fails to create WebView2)
      # - name: Install WebView2 Runtime (silent)
      #   if: matrix.os == 'windows-latest'
      #   run: |
      #     curl -L -o webview2.exe https://go.microsoft.com/fwlink/p/?LinkId=2124703
      #     .\webview2.exe /silent /install

      - name: Run E2E (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: tauri-e2e
        run: npm test
        env:
          DISABLE_SERVER_RUN: true

      - name: Stop app server (Windows)
        if: always()
        shell: pwsh
        run: |
          if (Test-Path server.pid) {
            $pid = Get-Content server.pid
            Write-Host "Stopping server PID $pid"
            taskkill /PID $pid /T /F | Out-Host
            Remove-Item server.pid -ErrorAction SilentlyContinue
          }
