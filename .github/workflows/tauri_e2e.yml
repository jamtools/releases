# .github/workflows/tauri-e2e.yml
name: Tauri WebDriver E2E
on:
    pull_request:
    push:
        branches:
            - "*"

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          repository: ${{ secrets.REPO }}
          token: ${{ secrets.REPO_TOKEN }}
          ref: tauri-e2e

      - name: Checkout releases repo into `.github/composite-actions`
        uses: actions/checkout@v3
        with:
          repository: jamtools/releases
          path: .github/composite-actions
          ref: ${{ github.sha }}

      # ---- Rust (for tauri + tauri-driver) ----
      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Tauri App
        uses: ./.github/composite-actions/.github/actions/build_desktop
        with:
            platform: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu-22.04' || 'windows-latest' }}
            tauri_args: ''
            tauri_target: ''
            sign_app: false
            profile: production
            site_url: http://localhost:1337
            apple_certificate: ${{ secrets.APPLE_CERTIFICATE }}
            apple_certificate_password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
            apple_signing_identity: ${{ secrets.APPLE_SIGNING_IDENTITY }}
            apple_id: ${{ secrets.APPLE_ID }}
            apple_password: ${{ secrets.APPLE_PASSWORD }}
            apple_team_id: ${{ secrets.APPLE_TEAM_ID }}
            github_token: ${{ secrets.GITHUB_TOKEN }}
            enable_debug: true
            # enable_debug: ${{ inputs.enable_debug }}

      # ---- tauri-driver (shared) ----
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      # ---- Linux-only bits: WebKit driver + xvfb ----
      - name: Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y webkit2gtk-driver xvfb libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

    #   - name: Run E2E (Linux)
    #     if: matrix.os == 'ubuntu-latest'
    #     run: xvfb-run pnpm -C e2e-tests test

      # ---- Windows-only bits: EdgeDriver + (optional) WebView2 runtime ----
      - name: Install matching EdgeDriver
        if: matrix.os == 'windows-latest'
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool
          "$HOME\.cargo\bin\msedgedriver-tool.exe" | Out-Host
          echo "$PWD" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Optional: ensure WebView2 Runtime (evergreen) exists on the runner
      # (Windows Server images sometimes drift; uncomment if your app fails to create WebView2)
      # - name: Install WebView2 Runtime (silent)
      #   if: matrix.os == 'windows-latest'
      #   run: |
      #     curl -L -o webview2.exe https://go.microsoft.com/fwlink/p/?LinkId=2124703
      #     .\webview2.exe /silent /install

    #   - name: Run E2E (Windows)
    #     if: matrix.os == 'windows-latest'
    #     run: pnpm -C e2e-tests test
