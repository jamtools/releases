name: build_mobile

on:
  # push:
  #   branches:
  #   - '*'

  repository_dispatch:
    types: [ build-remote ]

  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build for (all/android/ios)
        type: choice
        required: true
        default: all
        options:
        - all
        - android
        - ios
      profile:
        description: EAS build profile (preview/development/production)
        type: choice
        required: true
        default: preview
        options:
        - preview
        - development
        - production
      run_on_eas:
        description: Run build on eas? Will run locally in CI if false
        type: boolean
        default: false
      submit:
        description: Auto submit to the store? (production only)
        type: boolean
        required: false
      ref:
        description: 'Ref to use in application repo'
        required: false
        default: 'main'

env:
  TARGET_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref != '' && github.event.inputs.ref || github.event_name == 'repository_dispatch' && github.event.client_payload.sha != '' && github.event.client_payload.sha || 'main' }}

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
    - name: Log Workflow Inputs
      run: |
        echo "platform: ${{ github.event.inputs.platform }}"
        echo "profile: ${{ github.event.inputs.profile }}"
        echo "run_on_eas: ${{ github.event.inputs.run_on_eas }}"
        echo "submit: ${{ github.event.inputs.submit }}"
        echo "ref: ${{ github.event.inputs.ref }}"
        echo "TARGET_BRANCH: ${{ env.TARGET_BRANCH }}"
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        repository: ${{ secrets.REPO }}
        token: ${{ secrets.REPO_TOKEN }}
        ref: ${{ env.TARGET_BRANCH }}

    - name: Checkout releases repo into `.github/composite-actions`
      uses: actions/checkout@v3
      with:
        repository: jamtools/releases
        path: .github/composite-actions
        ref: ${{ github.sha }}

    - name: Build Mobile App with EAS
      uses: ./.github/composite-actions/.github/actions/build_mobile_eas
      with:
        local: ${{ !inputs.run_on_eas }}
        platform: ${{ inputs.platform || 'android' }}
        profile: ${{  inputs.profile || 'production' }}
        submit: ${{ inputs.submit }}
        expo-token: ${{ secrets.EXPO_TOKEN }}
    # - name: Build Mobile App with Gradle
    #   uses: ./.github/composite-actions/.github/actions/build_mobile_gradle
    #   with:
    #     build-type: debug
