name: Build Mobile App with EAS
description: A composite action to build an expo app with EAS.

inputs:
  expo-token:
    description: 'Expo token'
    required: true
  platform:
    description: 'Platform to build for (all/android/ios)'
    required: true
  profile:
    description: 'EAS build profile (preview/development/production)'
    required: true
  submit:
    description: 'Auto submit to the store? (production only)'
    required: false
  local:
    description: 'Build the app locally in CI'
    required: false
  install_command:
    description: 'Command used to install dependencies'
    required: false
    default: 'pnpm install --frozen-lockfile'
  build_command:
    description: 'Command used to prepare the mobile webview bundle'
    required: false
    default: 'pnpm run build'
  mobile_directory:
    description: 'Relative path to the Expo app'
    required: false
    default: 'apps/mobile'
  prebuild_command:
    description: 'Command used for local Expo prebuilds'
    required: false
    default: 'npx expo prebuild'
  site_url:
    description: 'Site URL used by the mobile webview bundle'
    required: false
    default: ''
  output_logs:
    description: 'Output EAS build to logs (if false, sends to /dev/null)'
    required: false
    default: 'false'
  asc_app_id:
    description: 'ASC app ID'
    required: false
  discord_webhook_url:
    description: 'Discord webhook URL for fingerprint change notifications'
    required: false

runs:
  using: 'composite'
  steps:
  - name: Log Action Inputs
    run: |
      echo "platform: ${{ inputs.platform }}"
      echo "profile: ${{ inputs.profile }}"
      echo "submit: ${{ inputs.submit }}"
      echo "local: ${{ inputs.local }}"
      echo "output_logs: ${{ inputs.output_logs }}"
      echo "install_command: ${{ inputs.install_command }}"
      echo "build_command: ${{ inputs.build_command }}"
      echo "mobile_directory: ${{ inputs.mobile_directory }}"
      echo "prebuild_command: ${{ inputs.prebuild_command }}"
      echo "site_url: ${{ inputs.site_url }}"
    shell: bash
  - name: Install pnpm
    uses: pnpm/action-setup@v4
    with:
      version: 10.15.0

  - name: Install Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20
      cache: 'pnpm'

  - name: Setup Expo
    uses: expo/expo-github-action@v8
    with:
      eas-version: latest
      token: ${{ inputs.expo-token }}
      packager: pnpm

  - name: Install modules
    shell: bash
    run: ${{ inputs.install_command }}

  - name: Build app
    shell: bash
    run: ${{ inputs.build_command }}
    env:
      SPRINGBOARD_PLATFORM_VARIANT: mobile
      PUBLIC_SITE_URL: ${{ inputs.site_url }}
      EXPO_PUBLIC_SITE_URL: ${{ inputs.site_url }}
      APP_PROFILE: ${{ inputs.profile }}
      EXPO_APP_PROFILE: ${{ inputs.profile }}

  - name: Compute expo fingerprint
    id: fingerprint
    uses: expo/expo-github-action/continuous-deploy-fingerprint-info@main
    with:
      profile: ${{ inputs.profile }}
      working-directory: ${{ inputs.mobile_directory }}
    env:
      PUBLIC_SITE_URL: ${{ inputs.site_url }}
      EXPO_PUBLIC_SITE_URL: ${{ inputs.site_url }}
      APP_PROFILE: ${{ inputs.profile }}
      EXPO_APP_PROFILE: ${{ inputs.profile }}

  - name: Check fingerprint changes and notify
    if: ${{ inputs.discord_webhook_url != '' && inputs.profile == 'production' }}
    shell: bash
    run: |
      FINGERPRINT_FILE="${{ inputs.mobile_directory }}/.expo-fingerprint.json"
      if [ -f "$FINGERPRINT_FILE" ]; then
        MAIN_ANDROID=$(jq -r '.android' "$FINGERPRINT_FILE")
        MAIN_IOS=$(jq -r '.ios' "$FINGERPRINT_FILE")

        CURRENT_ANDROID="${{ steps.fingerprint.outputs.android-fingerprint }}"
        CURRENT_IOS="${{ steps.fingerprint.outputs.ios-fingerprint }}"

        CHANGED=""
        if [ -n "$CURRENT_ANDROID" ] && [ "$MAIN_ANDROID" != "$CURRENT_ANDROID" ]; then
          CHANGED="Android fingerprint changed: $MAIN_ANDROID -> $CURRENT_ANDROID"
        fi
        if [ -n "$CURRENT_IOS" ] && [ "$MAIN_IOS" != "$CURRENT_IOS" ]; then
          if [ -n "$CHANGED" ]; then
            CHANGED="$CHANGED"$'\n'"iOS fingerprint changed: $MAIN_IOS -> $CURRENT_IOS"
          else
            CHANGED="iOS fingerprint changed: $MAIN_IOS -> $CURRENT_IOS"
          fi
        fi

        if [ -n "$CHANGED" ]; then
          echo "Fingerprint changed, sending Discord notification..."
          jq -n \
            --arg changes "$CHANGED" \
            --arg profile "${{ inputs.profile }}" \
            --arg platform "${{ inputs.platform }}" \
            '{"content": "⚠️ **Expo Fingerprint Changed** (build_mobile)\nProfile: \($profile) | Platform: \($platform)\n\($changes)\n\nA new native build may be required."}' | \
          curl -X POST -H "Content-Type: application/json" -d @- "${{ inputs.discord_webhook_url }}"
        else
          echo "Fingerprint unchanged"
        fi
      else
        echo "No fingerprint file found at $FINGERPRINT_FILE, skipping comparison"
      fi

  - name: Prebuild expo app
    if: ${{ inputs.local == 'true' }}
    shell: bash
    working-directory: ${{ inputs.mobile_directory }}
    run: ${{ inputs.prebuild_command }}

  - name: Run eas locally
    shell: bash
    if: ${{ inputs.local == 'true' }}
    working-directory: ${{ inputs.mobile_directory }}
    env:
      EXPO_GITHUB_ACTIONS_RUN: true
      PUBLIC_SITE_URL: ${{ inputs.site_url }}
      EXPO_PUBLIC_SITE_URL: ${{ inputs.site_url }}
      APP_PROFILE: ${{ inputs.profile }}
      EXPO_APP_PROFILE: ${{ inputs.profile }}
    run: eas build --non-interactive --wait --platform=${{ inputs.platform }} --profile=${{ inputs.profile }} --local

  - name: Send build to eas
    shell: bash
    if: ${{ inputs.local != 'true' && (inputs.submit != 'true' || inputs.profile != 'production') }}
    working-directory: ${{ inputs.mobile_directory }}
    env:
      PUBLIC_SITE_URL: ${{ inputs.site_url }}
      EXPO_PUBLIC_SITE_URL: ${{ inputs.site_url }}
      APP_PROFILE: ${{ inputs.profile }}
      EXPO_APP_PROFILE: ${{ inputs.profile }}
    run: eas build --non-interactive --wait --platform=${{ inputs.platform }} --profile=${{ inputs.profile }} ${{ inputs.output_logs == 'true' && '' || '1>/dev/null' }}

  - name: Build & submit mobile
    shell: bash
    if: ${{ inputs.submit == 'true' && inputs.profile == 'production' }}
    working-directory: ${{ inputs.mobile_directory }}
    env:
      ASC_APP_ID: ${{ inputs.asc_app_id }}
      PUBLIC_SITE_URL: ${{ inputs.site_url }}
      EXPO_PUBLIC_SITE_URL: ${{ inputs.site_url }}
      APP_PROFILE: ${{ inputs.profile }}
      EXPO_APP_PROFILE: ${{ inputs.profile }}
    run: eas build --non-interactive --wait --auto-submit --platform=${{ inputs.platform }} --profile=${{ inputs.profile }} ${{ inputs.output_logs == 'true' && '' || '1>/dev/null' }}
