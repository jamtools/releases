name: Build Mobile App with EAS
description: A composite action to build an expo app with EAS.

inputs:
  expo-token:
    description: 'Expo token'
    required: true
  platform:
    description: 'Platform to build for (all/android/ios)'
    required: true
  profile:
    description: 'EAS build profile (preview/development/production)'
    required: true
  submit:
    description: 'Auto submit to the store? (production only)'
    required: false
  local:
    description: 'Build the app locally in CI'
    required: false

runs:
  using: 'composite'
  steps:
  - name: Log Action Inputs
    run: |
      echo "platform: ${{ inputs.platform }}"
      echo "profile: ${{ inputs.profile }}"
      echo "submit: ${{ inputs.submit }}"
      echo "local: ${{ inputs.local }}"
    shell: bash
  - name: Install pnpm
    uses: pnpm/action-setup@v4
    with:
      version: 9.13.2

  - name: Install Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20
      cache: 'pnpm'

  - name: Setup Expo
    uses: expo/expo-github-action@v8
    with:
      eas-version: latest
      token: ${{ inputs.expo-token }}

  - name: Install modules
    shell: bash
    run: pnpm i

  - name: Build app
    shell: bash
    run: pnpm run build
    env:
      SPRINGBOARD_PLATFORM_VARIANT: mobile

  - name: Prebuild expo app
    if: ${{ inputs.local == 'true' }}
    shell: bash
    working-directory: apps/mobile
    run: npx expo prebuild

  - name: Run eas locally
    shell: bash
    if: ${{ inputs.local == 'true' }}
    working-directory: apps/mobile
    env:
      EXPO_GITHUB_ACTIONS_RUN: true
    run: eas build --non-interactive --wait --platform=${{ inputs.platform }} --profile=${{ inputs.profile }} --local

  - name: Send build to eas
    shell: bash
    if: ${{ inputs.local != 'true' && (inputs.submit != 'true' || inputs.profile != 'production') }}
    working-directory: apps/mobile
    run: eas build --non-interactive --wait --platform=${{ inputs.platform }} --profile=${{ inputs.profile }}

  - name: Build & submit mobile
    shell: bash
    if: ${{ inputs.submit == 'true' && inputs.profile == 'production' }}
    working-directory: apps/mobile
    run: eas build --non-interactive --wait --auto-submit --platform=${{ inputs.platform }} --profile=${{ inputs.profile }}
