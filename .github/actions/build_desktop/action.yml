name: Build Tauri App
description: A composite action to build a Tauri app.

inputs:
  platform:
    required: true
    description: 'Platform to run on'
  publish_version:
    required: false
    description: 'Version to inject into the app before building (SemVer)'
  tauri_args:
    required: true
    description: 'Arguments for Tauri'
  tauri_target:
    required: true
    description: 'Tauri build target'
  sign_app:
    required: true
    description: 'Whether to sign the app'
  profile:
    required: true
    description: 'Build profile (preview/development/production)'
  site_url:
    required: true
    description: 'Site URL'
  github_token:
    required: true
    description: 'GitHub token'
  apple_certificate:
    required: false
    description: 'Apple certificate'
  apple_certificate_password:
    required: false
    description: 'Apple certificate password'
  apple_signing_identity:
    required: false
    description: 'Apple signing identity'
  apple_id:
    required: false
    description: 'Apple ID'
  apple_password:
    required: false
    description: 'Apple password'
  apple_team_id:
    required: false
    description: 'Apple team ID'
  tauri_signing_private_key:
    required: false
    description: 'Tauri updater signing private key'
  tauri_signing_private_key_password:
    required: false
    description: 'Password for Tauri updater signing private key'
  enable_debug:
    required: false
    description: 'Enable debug'
  build_e2e:
    required: false
    description: 'Build e2e app'
  enable_custom_site_url:
    required: true
    description: 'Should enable custom site URL'

runs:
  using: 'composite'
  steps:
    - name: Log Action Inputs
      shell: bash
      run: |
        echo "platform: ${{ inputs.platform }}"
        echo "publish_version: ${{ inputs.publish_version }}"
        echo "tauri_args: ${{ inputs.tauri_args }}"
        echo "tauri_target: ${{ inputs.tauri_target }}"
        echo "sign_app: ${{ inputs.sign_app }}"
        echo "profile: ${{ inputs.profile }}"
        echo "site_url: ${{ inputs.site_url }}"
        echo "enable_debug: ${{ inputs.enable_debug }}"
        echo "enable_custom_site_url: ${{ inputs.enable_custom_site_url }}"

    - name: Normalize temp for bash + Node on Windows
      if: runner.os == 'Windows'
      shell: bash
      run: |
        mkdir -p /tmp

        if [ -d /d ]; then mkdir -p /d/tmp || true; fi

        echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
        echo "TEMP=$RUNNER_TEMP"   >> "$GITHUB_ENV"
        echo "TMP=$RUNNER_TEMP"    >> "$GITHUB_ENV"

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.15.0

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'pnpm'

    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable

    - name: Install OS dependencies (ubuntu only)
      shell: bash
      if: inputs.platform == 'ubuntu-22.04'
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

    - name: Install project node modules
      shell: bash
      run: pnpm i

    - name: Inject app version
      if: inputs.publish_version != ''
      shell: bash
      env:
        PUBLISH_VERSION: ${{ inputs.publish_version }}
      run: |
        python3 - <<'PY'
        import json
        import os
        import re
        from pathlib import Path

        publish_version = os.environ["PUBLISH_VERSION"].strip()

        tauri_base_conf_path = Path("apps/desktop_tauri/src-tauri/tauri.base.conf.json")
        cargo_toml_path = Path("apps/desktop_tauri/src-tauri/Cargo.toml")
        desktop_pkg_json_path = Path("apps/desktop_tauri/package.json")

        # Update tauri.base.conf.json
        base_conf = json.loads(tauri_base_conf_path.read_text(encoding="utf-8"))
        base_conf["version"] = publish_version
        tauri_base_conf_path.write_text(json.dumps(base_conf, indent=2) + "\n", encoding="utf-8")

        # Update Cargo.toml [package].version
        lines = cargo_toml_path.read_text(encoding="utf-8").splitlines(keepends=True)
        out = []
        in_package = False
        replaced = False

        for line in lines:
          stripped = line.strip()
          if stripped.startswith("[") and stripped.endswith("]"):
            in_package = stripped == "[package]"
          if in_package and not replaced and re.match(r'^version\\s*=\\s*\".*\"\\s*$', stripped):
            out.append(f'version = "{publish_version}"\\n')
            replaced = True
          else:
            out.append(line)

        if not replaced:
          raise RuntimeError("Failed to update Cargo.toml [package].version")

        cargo_toml_path.write_text("".join(out), encoding="utf-8")

        # Update apps/desktop_tauri/package.json version (optional consistency)
        if desktop_pkg_json_path.exists():
          desktop_pkg = json.loads(desktop_pkg_json_path.read_text(encoding="utf-8"))
          desktop_pkg["version"] = publish_version
          desktop_pkg_json_path.write_text(json.dumps(desktop_pkg, indent=2) + "\n", encoding="utf-8")

        print(f"Injected publish_version={publish_version}")
        PY

    - name: Populate e2e env vars (safe)
      if: inputs.build_e2e
      shell: bash
      run: |
        while IFS= read -r line; do
          # skip blanks and comments
          [ -z "$line" ] && continue
          case "$line" in \#*) continue;; esac
          key="${line%%=*}"
          val="${line#*=}"
          # protect critical vars
          case "$key" in PATH|TMP|TEMP|TMPDIR) continue;; esac
          echo "$key=$val" >> "$GITHUB_ENV"
        done < ./tests-e2e/.env.tests-e2e

    - name: Build app
      shell: bash
      run: |
        touch .env
        pnpm run build-desktop
      env:
        PUBLIC_SITE_URL: ${{ inputs.site_url }}
        EXPO_PUBLIC_SITE_URL: ${{ inputs.site_url }}
        PUBLIC_ENABLE_CUSTOM_SITE_URL: ${{ inputs.enable_custom_site_url }}
        SENTRY_DSN: ''
        SPRINGBOARD_PLATFORM_VARIANT: desktop,main
        APP_PROFILE: ${{ inputs.profile }}

    - name: Prebuild Tauri app
      shell: bash
      run: |
        pnpm run prebuild
      working-directory: ./apps/desktop_tauri
      env:
        APP_PROFILE: ${{ inputs.profile }}

    - name: Fetch Rust dependencies
      shell: bash
      run: cargo fetch
      working-directory: ./apps/desktop_tauri/src-tauri

    - name: Conditionally Install Rust Target (macOS)
      shell: bash
      if: inputs.platform == 'macos-latest'
      run: |
        rustup target add aarch64-apple-darwin
        rustup target add x86_64-apple-darwin

    - name: Set macOS signing environment variables
      shell: bash
      if: inputs.sign_app == 'true' && inputs.platform == 'macos-latest'
      run: |
        if ${{ inputs.sign_app }}; then
          echo "APPLE_CERTIFICATE=${{ inputs.apple_certificate }}" >> $GITHUB_ENV
          echo "APPLE_CERTIFICATE_PASSWORD=${{ inputs.apple_certificate_password }}" >> $GITHUB_ENV
          echo "APPLE_SIGNING_IDENTITY=${{ inputs.apple_signing_identity }}" >> $GITHUB_ENV
          echo "APPLE_ID=${{ inputs.apple_id }}" >> $GITHUB_ENV
          echo "APPLE_PASSWORD=${{ inputs.apple_password }}" >> $GITHUB_ENV
          echo "APPLE_TEAM_ID=${{ inputs.apple_team_id }}" >> $GITHUB_ENV
          echo "MACOS_SANDBOXED=true" >> $GITHUB_ENV
        fi

    - name: Set Tauri signing environment variables
      shell: bash
      run: |
        if [ -n "${{ inputs.tauri_signing_private_key }}" ]; then
          echo "TAURI_SIGNING_PRIVATE_KEY=${{ inputs.tauri_signing_private_key }}" >> $GITHUB_ENV
        fi
        if [ -n "${{ inputs.tauri_signing_private_key_password }}" ]; then
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${{ inputs.tauri_signing_private_key_password }}" >> $GITHUB_ENV
        fi

    # - name: Set Tauri log level
    #   run: echo "TAURI_LOG=trace" >> $GITHUB_ENV
    #   shell: bash

    - name: Build Tauri app
      run: npm run tauri build -- ${{ inputs.tauri_args }} ${{ ((inputs.enable_debug == 'true') && '--debug') || '' }}
      working-directory: ./apps/desktop_tauri
      shell: bash

