name: Update Mobile App with EAS Update
description: A composite action to update an expo app with EAS Update.

inputs:
  expo-token:
    description: 'Expo token'
    required: true
  platform:
    description: 'Platform to build for (all/android/ios)'
    required: true
  profile:
    description: 'EAS build profile (preview/development/production)'
    required: true
  site_url:
    description: 'Site URL'
    required: true
  message:
    description: 'Update message'
    required: false
    default: ''
  install_command:
    description: 'Command used to install dependencies'
    required: false
    default: 'pnpm install --frozen-lockfile'
  build_command:
    description: 'Command used to prepare the mobile webview bundle'
    required: false
    default: 'pnpm run build'
  mobile_directory:
    description: 'Relative path to the Expo app'
    required: false
    default: 'apps/mobile'
  discord_webhook_url:
    description: 'Discord webhook URL for fingerprint change notifications'
    required: false

runs:
  using: 'composite'
  steps:
  - name: Log Action Inputs
    run: |
      echo "platform: ${{ inputs.platform }}"
      echo "profile: ${{ inputs.profile }}"
      echo "message: ${{ inputs.message }}"
      echo "install_command: ${{ inputs.install_command }}"
      echo "build_command: ${{ inputs.build_command }}"
      echo "mobile_directory: ${{ inputs.mobile_directory }}"
    shell: bash
  - name: Install pnpm
    uses: pnpm/action-setup@v4
    with:
      version: 10.15.0

  - name: Install Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20
      cache: 'pnpm'

  - name: Setup Expo
    uses: expo/expo-github-action@v8
    with:
      eas-version: latest
      token: ${{ inputs.expo-token }}

  - name: Install modules
    shell: bash
    run: ${{ inputs.install_command }}

  - name: Build app
    shell: bash
    run: ${{ inputs.build_command }}
    env:
      SPRINGBOARD_PLATFORM_VARIANT: mobile
      PUBLIC_SITE_URL: ${{ inputs.site_url }}
      EXPO_PUBLIC_SITE_URL: ${{ inputs.site_url }}
      APP_PROFILE: ${{ inputs.profile }}
      EXPO_APP_PROFILE: ${{ inputs.profile }}

  - name: Compute expo fingerprint
    id: fingerprint
    uses: expo/expo-github-action/continuous-deploy-fingerprint-info@main
    with:
      profile: ${{ inputs.profile }}
      working-directory: ${{ inputs.mobile_directory }}
    env:
      PUBLIC_SITE_URL: ${{ inputs.site_url }}
      EXPO_PUBLIC_SITE_URL: ${{ inputs.site_url }}
      APP_PROFILE: ${{ inputs.profile }}
      EXPO_APP_PROFILE: ${{ inputs.profile }}

  - name: Check fingerprint changes and notify
    if: ${{ inputs.discord_webhook_url != '' }}
    shell: bash
    run: |
      FINGERPRINT_FILE="${{ inputs.mobile_directory }}/.expo-fingerprint.json"
      if [ -f "$FINGERPRINT_FILE" ]; then
        MAIN_ANDROID=$(jq -r '.android' "$FINGERPRINT_FILE")
        MAIN_IOS=$(jq -r '.ios' "$FINGERPRINT_FILE")

        CURRENT_ANDROID="${{ steps.fingerprint.outputs.android-fingerprint }}"
        CURRENT_IOS="${{ steps.fingerprint.outputs.ios-fingerprint }}"

        CHANGED=""
        if [ -n "$CURRENT_ANDROID" ] && [ "$MAIN_ANDROID" != "$CURRENT_ANDROID" ]; then
          CHANGED="Android fingerprint changed: $MAIN_ANDROID -> $CURRENT_ANDROID"
        fi
        if [ -n "$CURRENT_IOS" ] && [ "$MAIN_IOS" != "$CURRENT_IOS" ]; then
          if [ -n "$CHANGED" ]; then
            CHANGED="$CHANGED"$'\n'"iOS fingerprint changed: $MAIN_IOS -> $CURRENT_IOS"
          else
            CHANGED="iOS fingerprint changed: $MAIN_IOS -> $CURRENT_IOS"
          fi
        fi

        if [ -n "$CHANGED" ]; then
          echo "Fingerprint changed, sending Discord notification..."
          jq -n \
            --arg changes "$CHANGED" \
            --arg profile "${{ inputs.profile }}" \
            --arg platform "${{ inputs.platform }}" \
            '{"content": "⚠️ **Expo Fingerprint Changed** (update_mobile)\nProfile: \($profile) | Platform: \($platform)\n\($changes)\n\nA new native build may be required."}' | \
          curl -X POST -H "Content-Type: application/json" -d @- "${{ inputs.discord_webhook_url }}"
        else
          echo "Fingerprint unchanged"
        fi
      else
        echo "No fingerprint file found at $FINGERPRINT_FILE, skipping comparison"
      fi

  - name: Send update to eas
    shell: bash
    working-directory: ${{ inputs.mobile_directory }}
    run: |
      UPDATE_MESSAGE="${{ inputs.message }}"
      if [ -z "$UPDATE_MESSAGE" ]; then
        UPDATE_MESSAGE="$(git log -1 --pretty=%B)"
      fi
      eas update --non-interactive --channel=${{ (inputs.profile == 'production' && 'beta-production') || inputs.profile }} --message="$UPDATE_MESSAGE" --environment=${{ (inputs.profile == 'production' && 'production') || 'preview' }} --platform=${{ inputs.platform }}
    env:
      PUBLIC_SITE_URL: ${{ inputs.site_url }}
      EXPO_PUBLIC_SITE_URL: ${{ inputs.site_url }}
      APP_PROFILE: ${{ inputs.profile }}
      EXPO_APP_PROFILE: ${{ inputs.profile }}
